<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCrab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff; color: #1a1a1a;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #eee;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header-actions { display: flex; gap: 6px; align-items: center; }

    .refresh-wrap {
      position: relative;
      display: inline-block;
    }
    .refresh-label {
      border: 1px solid #eee; background: #fafafa; color: #999;
      border-radius: 999px; font-size: 11px;
      padding: 5px 10px; cursor: default;
    }
    .refresh-wrap .refresh-tip {
      display: none;
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 6px; padding: 5px 10px;
      background: #333; color: #fff; font-size: 11px;
      border-radius: 6px; white-space: nowrap; z-index: 10;
    }
    .refresh-wrap:hover .refresh-tip { display: block; }

    .btn-icon {
      border: none; background: none; color: #999;
      font-size: 16px; cursor: pointer; padding: 4px; border-radius: 6px;
      transition: color 0.15s, background 0.15s; line-height: 1;
    }
    .btn-icon:hover { color: #e63e1c; background: #fff5f2; }
    .btn-icon.active { color: #e63e1c; background: #fff5f2; }

    .meta { font-size: 11px; color: #999; padding: 4px 16px 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; }
    .meta-left { display: flex; align-items: center; }
    .meta-left.pending { color: #e63e1c; }
    .spinner {
      width: 10px; height: 10px; border-radius: 999px; margin-right: 6px;
      border: 2px solid rgba(230, 62, 28, 0.2); border-top-color: #e63e1c;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .sort-group { display: flex; gap: 4px; align-items: center; }
    .sort-label { font-size: 11px; color: #bbb; margin-right: 2px; }
    .sort-btn {
      border: 1px solid #eee; background: #fff; color: #999;
      border-radius: 999px; font-size: 11px; font-weight: 600;
      padding: 2px 8px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 3px;
    }
    .sort-btn:hover { border-color: #e63e1c; color: #e63e1c; }
    .sort-btn.active { background: #e63e1c; color: #fff; border-color: #e63e1c; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot.ok { background: #22c55e; }
    .dot.err { background: #ef4444; }

    /* ── Categories bar ── */
    .cat-bar {
      display: flex; gap: 6px; padding: 6px 16px 8px;
      overflow-x: auto; flex-shrink: 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .cat-bar::after {
      content: ''; flex-shrink: 0; width: 12px;
    }
    .cat-bar::-webkit-scrollbar { height: 0; }
    .cat-chip {
      border: 1px solid #ddd; background: #fff; color: #666;
      border-radius: 999px; font-size: 11px; font-weight: 600;
      padding: 3px 10px; cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: all 0.15s;
    }
    .cat-chip:hover { border-color: #e63e1c; color: #e63e1c; }
    .cat-chip.active { background: #e63e1c; color: #fff; border-color: #e63e1c; }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .trend-item {
      display: grid; grid-template-columns: 28px 1fr auto;
      align-items: start; gap: 10px; padding: 10px;
      border-radius: 10px; cursor: pointer;
      transition: background 0.12s; border-bottom: 1px solid #f5f5f5;
    }
    .trend-item:last-child { border-bottom: none; }
    .trend-item:hover { background: #fff5f2; }

    .rank { font-size: 14px; font-weight: 800; color: #e63e1c; text-align: center; padding-top: 2px; }
    .name { font-size: 14px; font-weight: 600; color: #1a1a1a; word-break: break-word; line-height: 1.3; }
    .desc { font-size: 11px; color: #888; margin-top: 2px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item-right { text-align: right; padding-top: 2px; white-space: nowrap; }
    .heat-score { font-size: 13px; font-weight: 800; color: #e63e1c; white-space: nowrap; }
    .heat-label { font-size: 9px; color: #bbb; }

    .sub { margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: #999; }
    .tag { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 7px; border: 1px solid currentColor; }
    .heat { color: #e63e1c; font-weight: 700; }
    .delta-up { color: #e63e1c; font-weight: 700; }
    .delta-down { color: #999; font-weight: 600; }
    .date-label { color: #bbb; font-size: 10px; }

    .empty { padding: 40px 16px; text-align: center; color: #bbb; font-size: 13px; line-height: 1.6; }
    .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

    /* ── Settings ── */
    .settings-panel { display: none; padding: 16px; flex: 1; overflow-y: auto; }
    .settings-panel.visible { display: block; }
    .sg { margin-bottom: 18px; }
    .sg-title { font-size: 12px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .sr { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .sr input[type="text"], .sr select {
      background: #fff; color: #1a1a1a; border: 1px solid #ddd;
      border-radius: 6px; padding: 6px 10px; font-size: 12px;
    }
    .sr input[type="text"] { width: 200px; }
    .save-btn {
      width: 100%; padding: 10px; border-radius: 999px; border: none;
      background: #e63e1c; color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; margin-top: 12px; transition: background 0.15s;
    }
    .save-btn:hover { background: #d03518; }

    .powered-by {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee;
      text-align: center; font-size: 12px; color: #bbb;
    }
    .powered-by a { color: #e63e1c; text-decoration: none; font-weight: 600; }
    .powered-by a:hover { text-decoration: underline; }

    .dialog-backdrop {
      position: fixed; inset: 0; background: rgba(26, 26, 26, 0.28);
      display: none; align-items: flex-end; justify-content: center; z-index: 100;
      padding: 16px;
    }
    .dialog-backdrop.visible { display: flex; }
    .dialog {
      width: min(100%, 760px); background: #fff; border-radius: 18px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18); overflow: hidden;
      border: 1px solid #f1dfd9;
    }
    .dialog-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid #f3f3f3;
    }
    .dialog-title { font-size: 16px; font-weight: 800; color: #1a1a1a; line-height: 1.35; }
    .dialog-subtitle { margin-top: 4px; font-size: 12px; color: #999; }
    .dialog-close {
      border: none; background: #fff5f2; color: #e63e1c; width: 32px; height: 32px;
      border-radius: 999px; cursor: pointer; font-size: 18px; line-height: 1;
      flex-shrink: 0;
    }
    .dialog-body { padding: 12px 16px 16px; max-height: min(70vh, 720px); overflow-y: auto; }
    .dialog-description {
      font-size: 14px; line-height: 1.7; color: #222;
      margin-bottom: 14px;
    }
    .dialog-section-title {
      font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
      text-transform: uppercase; color: #b16b5a; margin-bottom: 10px;
    }
    .opinion-panel {
      border: 1px solid #f0d7d0; border-radius: 14px; background: #fffdfc;
      padding: 16px; margin-bottom: 14px;
    }
    .opinion-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 12px;
    }
    .opinion-panel-title {
      font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
      text-transform: uppercase; color: #6f6f6f;
    }
    .sentiment-badge {
      border: 1px solid #ffb7ab; color: #d03518; background: #fff3f0;
      border-radius: 10px; padding: 8px 12px; font-size: 11px; font-weight: 700;
      white-space: nowrap;
    }
    .opinion-main {
      font-size: 13px; line-height: 1.65; color: #2a2a2a;
    }
    .opinion-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px;
    }
    .opinion-column-title {
      font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
      text-transform: uppercase; color: #7d7d7d; margin-bottom: 10px;
    }
    .viewpoint-list { display: flex; flex-direction: column; gap: 10px; }
    .viewpoint-card {
      border: 1px solid #efefef; border-radius: 12px; padding: 12px; background: #fff;
    }
    .viewpoint-stance {
      display: inline-flex; align-items: center; border-radius: 9px;
      background: #f5f5f5; color: #2f2f2f; padding: 5px 10px;
      font-size: 11px; font-weight: 700; margin-bottom: 8px;
    }
    .viewpoint-summary {
      font-size: 12px; line-height: 1.6; color: #303030;
    }
    .controversy-list {
      margin: 0; padding-left: 18px; color: #303030;
      display: flex; flex-direction: column; gap: 10px;
    }
    .controversy-list li {
      font-size: 12px; line-height: 1.6;
    }
    .source-list { display: flex; flex-direction: column; gap: 10px; }
    .source-link {
      display: block; border: 1px solid #f0d7d0; border-radius: 12px;
      padding: 12px; color: #7a4b41; text-decoration: none; background: #fffaf8;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .source-link:hover {
      border-color: #e8ad9a; transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(230, 62, 28, 0.08); text-decoration: none;
    }
    .source-index { font-size: 11px; font-weight: 800; color: #e63e1c; margin-bottom: 6px; }
    .source-url {
      font-size: 12px; line-height: 1.5; word-break: break-all;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    @media (max-width: 640px) {
      .opinion-header { flex-direction: column; }
      .sentiment-badge { white-space: normal; }
      .opinion-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🦀 XCrab</h1>
    <div class="header-actions">
      <div class="refresh-wrap">
        <span class="refresh-label" id="refreshLabel">Auto</span>
        <span class="refresh-tip" id="refreshTip">Daily auto-refresh · 每日自动刷新</span>
      </div>
      <button class="btn-icon" id="settingsToggle" title="Settings">⚙</button>
    </div>
  </div>
  <div class="meta" id="meta">
    <span class="meta-left"><span class="dot"></span>Loading...</span>
    <span class="sort-group">
      <span class="sort-label" id="sortLabel">Sort by</span>
      <button class="sort-btn active" id="sortHeat" data-sort="heatScore">🔥 Hot</button>
      <button class="sort-btn" id="sortTime" data-sort="createdAt">🕐 New</button>
    </span>
  </div>
  <div class="cat-bar" id="catBar"></div>

  <div class="content" id="trendsView">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🦀</div>Loading trends...
    </div>
    <div id="trendList"></div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="sg">
      <div class="sg-title">Display</div>
      <div class="sr"><span>Language</span>
        <select id="locale"><option value="en-US">English</option><option value="zh-CN">中文</option></select>
      </div>
      <div class="sr"><span>Results</span>
        <select id="limit"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select>
      </div>
    </div>
    <button class="save-btn" id="saveSettings">Save Settings</button>
    <div class="powered-by">Powered by <a href="https://atypica.ai/pulse" target="_blank">atypica.ai</a></div>
  </div>

  <div class="dialog-backdrop" id="sourceDialogBackdrop">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sourceDialogTitle">
      <div class="dialog-header">
        <div>
          <div class="dialog-title" id="sourceDialogTitle">Source posts</div>
          <div class="dialog-subtitle" id="sourceDialogSubtitle"></div>
        </div>
        <button class="dialog-close" id="sourceDialogClose" type="button">×</button>
      </div>
      <div class="dialog-body">
        <div class="dialog-description" id="sourceDialogDescription"></div>
        <div class="opinion-panel" id="sourceDialogOpinion"></div>
        <div class="dialog-section-title" id="sourceDialogSectionTitle">Original Posts</div>
        <div class="source-list" id="sourceDialogList"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
